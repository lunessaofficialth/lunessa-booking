<!DOCTYPE html>
<html lang="th"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Lunessa แก้เวลาคิว</title><link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet"/><style>body{margin:0;background:#F3EEE7;color:#1A1714;font-family:Sarabun,sans-serif}.wrap{max-width:640px;margin:0 auto;padding:22px 14px 60px}h1{color:#3E4F44}.card{background:#FFFCF8;border:1px solid #E6DED4;border-radius:16px;padding:12px;margin:10px 0}input,button{font:inherit}input{width:90px;padding:8px;border:1px solid #E6DED4;border-radius:10px}button{border:0;background:#3E4F44;color:#fff;border-radius:999px;padding:8px 12px;font-weight:700}</style></head><body><div class="wrap"><h1>แก้เวลาคิว</h1><p>แก้ตัวเลขชั่วโมงในช่องชั่วโมง หน้าจองจะปิดช่วงนั้นทันที ไม่ต้องอัปเว็บใหม่</p><div id="list">กำลังดึงคิว</div></div><script src="staff.js?v=2"></script><script>
const SHEET='16aGhjPvcEsrw1NAc9qULkE3B4RuroBe9kRK-oIc1ZVg';
const API='https://script.google.com/macros/s/AKfycbyOM3MfkwLwBf0RkPlAoKzfa_1EbX2yjPyVP54G-YNUspcjVT9zm82VegNvMyvvbXt5/exec';
function parse(t){return t.trim().split(/\n/).map(l=>l.split(',').map(x=>x.replace(/^"|"$/g,'')))}
async function load(){const t=await fetch('https://docs.google.com/spreadsheets/d/'+SHEET+'/gviz/tq?tqx=out:csv&sheet=WEB_BOOKINGS').then(r=>r.text());const rows=parse(t).slice(1).filter(r=>r[0]&&String(r[9]).indexOf('ยกเลิก')===-1);document.getElementById('list').innerHTML=rows.slice(-20).reverse().map(r=>'<div class="card"><b>'+r[5]+' '+r[6]+'</b> '+r[2]+'<br>'+r[11]+'<br>ชั่วโมงที่กันคิว <input data-id="'+r[0]+'" value="'+r[7]+'"> <button data-id="'+r[0]+'">บันทึก</button></div>').join('')||'ยังไม่มีคิว';document.querySelectorAll('button[data-id]').forEach(btn=>btn.onclick=()=>save(btn.dataset.id))}
async function save(id){const hours=document.querySelector('input[data-id="'+id+'"]').value;await fetch(API,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'updateHours',key:staffKey(),booking_id:id,hours:Number(hours)})});alert('ส่งแล้ว ถ้าสคริปต์ยังไม่ได้รับคำสั่ง updateHours ให้แก้ช่องชั่วโมงในแถบ WEB_BOOKINGS ของรหัสจองนี้แล้วกดรีเฟรชหน้าจอง')}
load();
</script></body></html>
