<!DOCTYPE html>
<html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Lunessa ประวัติลูกค้า</title><link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet"><style>:root{--ivory:#F3EEE7;--ink:#1A1714;--sage:#3E4F44;--line:#E6DED4}*{box-sizing:border-box}body{margin:0;background:var(--ivory);color:var(--ink);font-family:Sarabun,sans-serif}.wrap{max-width:680px;margin:0 auto;padding:22px 14px 60px}h1{color:var(--sage)}input{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;font:inherit}button{margin-top:8px;border:0;background:var(--sage);color:#fff;border-radius:999px;padding:12px 16px;font:inherit;font-weight:700}.card{background:#FFFCF8;border:1px solid var(--line);border-radius:16px;padding:12px;margin:10px 0}.muted{color:#6d655e;font-size:14px}</style></head><body><div class="wrap"><h1>ประวัติลูกค้า</h1><p class="muted">พิมพ์เบอร์ ชื่อเจ้าของ หรือชื่อน้อง จะเห็นประวัติทั้งหมด</p><input id="q" placeholder="เช่น 0659792863 หรือ ยุพิน หรือ มิโล"><button id="go" type="button">ค้นประวัติ</button><div id="out"></div></div><script>
const API='https://script.google.com/macros/s/AKfycbyOM3MfkwLwBf0RkPlAoKzfa_1EbX2yjPyVP54G-YNUspcjVT9zm82VegNvMyvvbXt5/exec';
document.getElementById('go').onclick=async()=>{
  const q=document.getElementById('q').value.trim();
  const out=document.getElementById('out');
  if(!q){out.innerHTML='<p class="muted">ยังไม่ได้พิมพ์คำค้น</p>';return;}
  out.innerHTML='<p class="muted">กำลังค้น</p>';
  try{
    const res=await fetch(API+'?action=lookup&q='+encodeURIComponent(q));
    const data=await res.json();
    const rows=data.rows||[];
    if(!rows.length){out.innerHTML='<p class="muted">ไม่พบประวัติ หรือสคริปต์ยังไม่ได้ Deploy</p>';return;}
    out.innerHTML=rows.map(r=>'<div class="card"><strong>'+r.pet+'</strong> · '+r.owner+'<br>'+r.date+' · '+r.service+'<br>'+r.type+' · '+r.coat+' · '+r.weight+' กก.<br>ค่าบริการ ฿'+r.price+' · มัดจำ ฿'+r.deposit+' · ชำระเพิ่ม ฿'+r.extra+'<br>'+(r.note||'')+'<div class="muted">'+r.phone+'</div></div>').join('');
  }catch(e){out.innerHTML='<p class="muted">ยังค้นไม่ได้ ต้อง Deploy สคริปต์รับคำสั่ง lookup ก่อน</p>';}
};
</script></body></html>
