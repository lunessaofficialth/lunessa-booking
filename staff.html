<!DOCTYPE html>
<html lang="th"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Lunessa ใบเสร็จ</title><link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet"/><style>body{margin:0;background:#F3EEE7;color:#1A1714;font-family:Sarabun,sans-serif}.wrap{max-width:560px;margin:0 auto;padding:24px 16px 60px}h1{color:#3E4F44}label{display:block;margin:10px 0 4px}input,textarea{width:100%;padding:12px;border:1px solid #E6DED4;border-radius:14px;font:inherit}button{border:0;background:#3E4F44;color:#fff;border-radius:999px;padding:12px 16px;font:inherit;font-weight:700}.card{background:#FFFCF8;border:1px solid #E6DED4;border-radius:18px;padding:14px;margin:10px 0}.item{display:block;width:100%;text-align:left;background:#fff;color:#1A1714;border:1px solid #E6DED4;margin:6px 0}.pet{border-top:1px solid #E6DED4;margin-top:12px;padding-top:8px}</style></head><body><div class="wrap"><h1>ใบเสร็จหลังบริการ</h1><p>กรอกแยกตามจำนวนน้อง ถ้าจอง 2 ตัว จะมี 2 ช่อง</p><label>วัน</label><input id="date" type="date"/><div id="list"></div><div id="form"></div></div><script src="staff.js?v=2"></script><script>
const SHEET='16aGhjPvcEsrw1NAc9qULkE3B4RuroBe9kRK-oIc1ZVg';
const API='https://script.google.com/macros/s/AKfycbyOM3MfkwLwBf0RkPlAoKzfa_1EbX2yjPyVP54G-YNUspcjVT9zm82VegNvMyvvbXt5/exec';
let rows=[];
function parseCsv(text){const rows=[];let row=[],cur='',q=false;for(let i=0;i<text.length;i++){const c=text[i];if(q){if(c==='"'&&text[i+1]==='"'){cur+='"';i++;}else if(c==='"'){q=false;}else cur+=c;}else if(c==='"'){q=true;}else if(c===','){row.push(cur);cur='';}else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur='';}else if(c!=='\r'){cur+=c;}}if(cur||row.length){row.push(cur);rows.push(row);}return rows;}
function ymd(v){const m=String(v||'').match(/(\d{4})-(\d{2})-(\d{2})/);if(m)return m[0];const d=new Date(v);if(isNaN(d))return '';return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function petsOf(raw){try{const p=JSON.parse(raw||'[]');return Array.isArray(p)&&p.length?p:[{name:'น้อง'}];}catch(e){return [{name:raw||'น้อง'}];}}
async function load(){const text=await fetch('https://docs.google.com/spreadsheets/d/'+SHEET+'/gviz/tq?tqx=out:csv&sheet=WEB_BOOKINGS').then(r=>r.text());const all=parseCsv(text);const head=all[0];rows=all.slice(1).filter(r=>r[0]).map(r=>{const o={};head.forEach((h,i)=>o[h]=r[i]||'');return o;});draw();}
function draw(){const day=document.getElementById('date').value;const list=document.getElementById('list');list.innerHTML=rows.filter(r=>ymd(r.date)===day).map(r=>{const names=petsOf(r.pets_json).map(p=>p.name).join(', ');return '<button class="item" data-id="'+r.booking_id+'">'+r.time+' · '+r.owner+' · '+names+'</button>';}).join('')||'<p>วันนี้ยังไม่มีคิว</p>';list.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>openForm(b.dataset.id));}
function openForm(id){const r=rows.find(x=>x.booking_id===id);const pets=petsOf(r.pets_json);document.getElementById('form').innerHTML='<div class="card"><strong>'+r.booking_id+' · '+r.owner+'</strong>'+pets.map((p,i)=>'<div class="pet"><strong>น้องตัวที่ '+(i+1)+' · '+p.name+'</strong><label>น้ำหนัก (กก.)</label><input data-w="'+i+'" placeholder="4.2"/><label>ราคาตัวนี้</label><input data-p="'+i+'" placeholder="550"/><label>สิ่งที่เจอวันนี้</label><textarea data-n="'+i+'" placeholder="ผิวปกติ มีรอยแดงที่ท้อง"></textarea></div>').join('')+'<button id="save">บันทึกและสร้างลิงก์</button><p id="out"></p></div>';document.getElementById('save').onclick=async()=>{const packed=pets.map((p,i)=>({name:p.name,weight:document.querySelector('[data-w="'+i+'"]').value,price:document.querySelector('[data-p="'+i+'"]').value,note:document.querySelector('[data-n="'+i+'"]').value}));const total=packed.reduce((s,p)=>s+(Number(p.price)||0),0);await fetch(API,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'saveReceipt',key:staffKey(),booking_id:id,weight:packed.map(p=>p.name+' '+p.weight+'kg').join(' | '),price:total,found:JSON.stringify(packed)})});const link='https://lunessaofficialth.github.io/lunessa-booking/receipt.html?id='+encodeURIComponent(id);document.getElementById('out').innerHTML='รวม ฿'+total+'<br>ส่งลิงก์นี้ในไลน์<br><a href="'+link+'">'+link+'</a>';};}
const d=document.getElementById('date');d.value=new Date().toISOString().slice(0,10);d.onchange=draw;load();
</script></body></html>
