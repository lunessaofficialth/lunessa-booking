<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Lunessa จองคิว</title><style>body{margin:0;font-family:sans-serif;background:#F3EEE7;color:#1A1714;line-height:1.5}.w{max-width:820px;margin:auto;padding:16px 16px 72px}.card{background:#FFFcf7;border:1px solid #e4ddd3;border-radius:16px;padding:16px;margin:12px 0}.btn{display:inline-block;border:0;border-radius:999px;padding:12px 16px;font-weight:700;text-decoration:none}.p{background:#3E4F44;color:#fff}.g{background:#fff;color:#3E4F44;border:1px solid #3E4F44}label{display:block;margin:8px 0 4px;font-size:13px}input,select,textarea{width:100%;padding:10px;border:1px solid #e4ddd3;border-radius:10px;box-sizing:border-box}.slots button{margin:4px;padding:8px 12px;border-radius:10px;border:1px solid #e4ddd3;background:#fff}.slots button.on{background:#3E4F44;color:#fff}.row{display:flex;gap:8px;flex-wrap:wrap}</style></head><body><div class="w"><h1 style="color:#3E4F44">LUNESSA</h1><p>กรูมมิ่งหมา-แมว · พฤกษา 116 คลองหก บ้าน 81/269 เลยซอย 28 บ้านขวามือ</p><div class="row"><a class="btn p" href="https://maps.app.goo.gl/d1iWtFBwY7yw5zRz6">แผนที่</a><a class="btn g" href="https://line.me/R/ti/p/@300kvtvw">LINE</a><a class="btn g" href="tel:0659792863">065-979-2863</a></div><div class="card"><h2>จองคิว</h2><div id="pets"></div><button class="btn g" type="button" id="addPet">+ น้องตัวที่ 2</button><label>ชื่อเจ้าของ</label><input id="owner"><label>เบอร์</label><input id="phone"><label>ไลน์</label><input id="lineId"><label>วัน</label><input type="date" id="date"><div class="slots" id="slots"></div><p id="dayNote"></p><p>เวลา <b id="hoursTxt">-</b> · มัดจำ <b id="depTxt">-</b></p><p>มาสายได้ไม่เกิน 15 นาที</p><button class="btn p" type="button" id="goPay">สรุปและโอนมัดจำ</button></div></div><script>const CLOSED=['2026-10-23','2026-10-24','2026-10-29','2026-10-30','2026-10-31','2026-11-01','2026-11-02','2026-11-03','2026-11-04','2026-11-05','2026-11-06','2026-11-07'];let n=1,chosen='';function petHTML(i){return '<div class="pet"><b>น้อง '+i+'</b><label>ชื่อ</label><input class="pname"><label>บริการ</label><select class="psvc"><option value="addon">เสริม</option><option value="bath" selected>อาบน้ำ</option><option value="cut">ตัดอย่างเดียว</option><option value="clip">อาบน้ำ+ไถ</option><option value="scissor">อาบน้ำ+กรรไกร</option></select><label>ข้อควรระวัง</label><textarea class="pcaut"></textarea></div>'}pets.innerHTML=petHTML(1);addPet.onclick=()=>{if(n>=2)return;n=2;pets.insertAdjacentHTML('beforeend',petHTML(2));addPet.hidden=true;bind()};function bind(){pets.querySelectorAll('select').forEach(el=>el.onchange=plan);plan()}bind();function rank(s){return {addon:1,bath:2,cut:2,clip:3,scissor:3}[s]}function hours(a,b){if(!b)return a==='addon'?1:(a==='bath'||a==='cut'?2:3);const x=[a,b].sort((p,q)=>rank(p)-rank(q));if(x[0]==='addon'&&x[1]==='addon')return 1;if(x[0]==='addon'&&x[1]==='bath')return 2;if(x[0]==='addon'&&x[1]==='cut')return 3;if(x[0]==='addon')return 4;if((x[0]==='bath'||x[0]==='cut')&&(x[1]==='bath'||x[1]==='cut'))return 3;return 4}function dep(s){return (s==='clip'||s==='scissor')?400:200}function read(){return [...pets.querySelectorAll('.pet')].map(b=>({name:b.querySelector('.pname').value.trim()||'น้อง',service:b.querySelector('.psvc').value,caution:b.querySelector('.pcaut').value.trim()}))}function plan(){const p=read(),h=hours(p[0].service,p[1]&&p[1].service),d=p.reduce((s,x)=>s+dep(x.service),0);hoursTxt.textContent=h+' ชม.';depTxt.textContent=d+' บาท';draw(h);return {h,d,p}}function draw(h){slots.innerHTML='';dayNote.textContent='';if(CLOSED.indexOf(date.value)!==-1){dayNote.textContent='วันนี้ร้านหยุด จองไม่ได้';chosen='';return}const last=h<=2?19:h===3?18:17;['10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00','18:00','19:00'].forEach(t=>{const b=document.createElement('button');b.type='button';b.textContent=t;b.className=chosen===t?'on':'';b.disabled=+t.slice(0,2)>last;b.onclick=()=>{chosen=t;plan()};slots.appendChild(b)})}date.min=new Date().toISOString().slice(0,10);date.value=date.min;date.onchange=()=>plan();goPay.onclick=()=>{const pl=plan();if(CLOSED.indexOf(date.value)!==-1){alert('วันนี้หยุด');return}if(!owner.value.trim()||!phone.value.trim()){alert('ใส่ชื่อกับเบอร์');return}if(!chosen){alert('เลือกเวลา');return}if(pl.p.some(x=>!x.caution)){alert('ใส่ข้อควรระวัง');return}const code='LN-'+Date.now().toString().slice(-6);alert('รหัสจอง '+code+' โอนมัดจำ '+pl.d+' บาท แล้วส่งสลิปไลน์');};</script></body></html>
